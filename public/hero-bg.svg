<svg xmlns="http://www.w3.org/2000/svg" width="2560" height="1440" viewBox="0 0 2560 1440" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Main vertical atmospheric gradient -->
    <linearGradient id="base" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#01040B"/>
      <stop offset="0.075" stop-color="#020A1B"/>
      <stop offset="0.18" stop-color="#061C4A"/>
      <stop offset="0.34" stop-color="#073D91"/>
      <stop offset="0.50" stop-color="#0872E8"/>
      <stop offset="0.64" stop-color="#4A9FF0"/>
      <stop offset="0.77" stop-color="#A9CEF2"/>
      <stop offset="0.89" stop-color="#E5F1FB"/>
      <stop offset="1" stop-color="#FFFFFF"/>
    </linearGradient>

    <!-- Soft blue atmospheric bloom -->
    <radialGradient id="bloom" cx="50%" cy="43%" r="72%">
      <stop offset="0" stop-color="#1685FF" stop-opacity="0.34"/>
      <stop offset="0.38" stop-color="#1685FF" stop-opacity="0.16"/>
      <stop offset="0.72" stop-color="#1685FF" stop-opacity="0.035"/>
      <stop offset="1" stop-color="#1685FF" stop-opacity="0"/>
    </radialGradient>

    <!-- Subtle lower white illumination -->
    <linearGradient id="whiteFade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="0.55" stop-color="#FFFFFF" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.34"/>
    </linearGradient>

    <!-- Very subtle horizontal atmospheric variation -->
    <radialGradient id="centerLight" cx="50%" cy="56%" r="58%">
      <stop offset="0" stop-color="#72B8FF" stop-opacity="0.12"/>
      <stop offset="0.65" stop-color="#72B8FF" stop-opacity="0.025"/>
      <stop offset="1" stop-color="#72B8FF" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="2560" height="1440" fill="url(#base)"/>
  <rect width="2560" height="1440" fill="url(#bloom)"/>
  <rect width="2560" height="1440" fill="url(#centerLight)"/>
  <rect width="2560" height="1440" fill="url(#whiteFade)"/>
</svg>